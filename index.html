<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOP Fresh - Hemtabad</title>
<style>
body{margin:0;background:#e8f5e9;font-family:Arial;padding-bottom:120px}
.header{background:#2e7d32;color:white;padding:15px;display:flex;justify-content:space-between}
.search{margin:10px;background:white;padding:10px;border-radius:10px;display:flex;gap:5px}
.search input{border:none;width:100%;outline:none}
.filters{display:flex;gap:8px;padding:10px;overflow-x:auto}
.filters button{border:none;padding:8px 15px;border-radius:20px;background:white;white-space:nowrap}
.filters button.active{background:#2e7d32;color:white}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:15px;padding:10px;text-align:center}
.card img{width:80px;height:80px}
.price{color:#2e7d32;font-weight:bold;margin:5px 0}
.card button{width:100%;background:#2e7d32;color:white;border:none;padding:8px;border-radius:15px;margin-top:5px}
#basket{position:fixed;bottom:10px;left:10px;right:10px;background:#2e7d32;color:white;padding:15px;border-radius:15px;display:none;justify-content:space-between}
#cartPage{display:none;background:white;margin:10px;padding:15px;border-radius:15px}
#cartPage input, #cartPage textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="header"><b>🟢 ROOP Fresh</b><span>📍 Hemtabad</span></div>
<div class="search">🔍<input id="searchBox" placeholder="Search..." onkeyup="doSearch()"></div>
<div class="filters">
<button class="active" onclick="doFilter('all',this)">All</button>
<button onclick="doFilter('veg',this)">Veg</button>
<button onclick="doFilter('snacks',this)">Snacks</button>
<button onclick="doFilter('drinks',this)">Drinks</button>
</div>
<div class="products" id="list"></div>
<div id="cartPage">
<h3>🛒 My Order</h3>
<div id="cartItems"></div>
<p><b>Total: Rs.<span id="gt">0</span></b></p>
<input id="cName" placeholder="Your Name">
<input id="cPhone" placeholder="Phone Number">
<textarea id="cAddr" placeholder="Full Address"></textarea>
<button onclick="sendWA()" style="width:100%;background:#25D366;color:white;padding:12px;border:none;border-radius:10px;font-weight:bold">Order on WhatsApp</button>
<button onclick="document.getElementById('cartPage').style.display='none'" style="width:100%;margin-top:5px;padding:8px;border:none;background:#eee;border-radius:10px">Close</button>
</div>
<div id="basket"><span>🧺 Rs.<span id="bTotal">0</span> (<span id="bCount">0</span> items)</span><button onclick="showCart()" style="background:white;color:#2e7d32;border:none;padding:8px 15px;border-radius:20px;font-weight:bold">View Cart</button></div>
<script>
let items=[
{name:"Tomato",price:30,cat:"veg",img:"🍅"},
{name:"Potato",price:25,cat:"veg",img:"🥔"},
{name:"Onion",price:45,cat:"veg",img:"🧅"},
{name:"Brinjal",price:40,cat:"veg",img:"🍆"},
{name:"Milk",price:32,cat:"veg",img:"🥛"},
{name:"Eggs 12pc",price:84,cat:"veg",img:"🥚"},
{name:"Lays Chips",price:20,cat:"snacks",img:"🍟"},
{name:"Coca Cola",price:40,cat:"drinks",img:"🥤"},
{name:"Biryani",price:150,cat:"snacks",img:"🍛"},
{name:"Momos",price:50,cat:"snacks",img:"🥟"},
];
let cart={},total=0;
let listDiv=document.getElementById('list');
function render(all){
listDiv.innerHTML="";
all.forEach((p,i)=>{
listDiv.innerHTML+=`<div class="card" data-cat="${p.cat}"><div style="font-size:50px">${p.img}</div><b>${p.name}</b><div class="price">₹${p.price}</div><button onclick="add(${i})">Add to Cart</button></div>`;
});
}
render(items);
function add(i){let p=items[i];if(!cart[p.name])cart[p.name]={q:0,price:p.price};cart[p.name].q++;update();}
function update(){total=0;let c=0;for(let k in cart){total+=cart[k].q*cart[k].price;c+=cart[k].q;}document.getElementById('bTotal').innerText=total;document.getElementById('bCount').innerText=c;document.getElementById('gt').innerText=total;document.getElementById('basket').style.display=c>0?"flex":"none";let html="";for(let k in cart){html+=`${k} x ${cart[k].q} = Rs.${cart[k].q*cart[k].price}<br>`;}document.getElementById('cartItems').innerHTML=html;}
function showCart(){document.getElementById('cartPage').style.display='block';window.scrollTo(0,document.body.scrollHeight);}
function doSearch(){let v=document.getElementById('searchBox').value.toLowerCase();let f=items.filter(x=>x.name.toLowerCase().includes(v));render(f);}
function doFilter(cat,el){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(cat=='all')render(items);else render(items.filter(x=>x.cat==cat));}
function sendWA(){let name=document.getElementById('cName').value;let phone=document.getElementById('cPhone').value;let addr=document.getElementById('cAddr').value;if(!name||!phone){alert("Name Phone din");return;}let msg=`*New Order ROOP Fresh*%0AName: ${name}%0APhone: ${phone}%0AAddr: ${addr}%0A%0A`;for(let k in cart){msg+=`${k} x ${cart[k].q} = Rs.${cart[k].q*cart[k].price}%0A`;}msg+=`%0ATotal: Rs.${total}`;window.open(`https://wa.me/917584036364?text=${msg}`);}
</script>
</body>
</html>
